server:
  port: 8080
eureka:
  instance:
    preferIpAddress: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      server:
        webflux:
          routes:
            - id: users-route
              uri: lb://userservice
              predicates:
                - Path=/users/**
            - id: email-message-route
              uri: lb://notificationservice
              predicates:
                - Path=/email-message/**
