server:
  port: 8080
spring:
  application: 
    name: ProjectGatewayApplication
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: users-route
              uri: http://localhost:8081
              predicates:
                - Path=/users/**
            - id: email-message-route
              uri: http://localhost:8082
              predicates:
                - Path=/email-message/**
